name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  android:
    runs-on: ubuntu-latest
    env:
      GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Enable FCM (only if the GOOGLE_SERVICES_JSON secret is set)
        if: ${{ env.GSJ != '' }}
        run: echo "$GSJ" > app/google-services.json
      - name: Unit tests (family + play)
        run: gradle --no-daemon :app:testFamilyDebugUnitTest :app:testPlayDebugUnitTest
      - name: Build debug APK (family flavor, installable)
        run: gradle --no-daemon :app:assembleFamilyDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HomePager-family-debug-apk
          path: android/app/build/outputs/apk/family/debug/*.apk
